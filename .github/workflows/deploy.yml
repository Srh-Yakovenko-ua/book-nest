name: Deploy

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/srh-yakovenko-ua

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            shared: &shared
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'turbo.json'
            api:
              - *shared
              - 'apps/api/**'
            web:
              - *shared
              - 'apps/web/**'

  build-api:
    name: Build API image
    needs: [ci, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/booknest-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=api-${{ github.ref_name }}

      - name: Scan API image (Trivy)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/booknest-api:${{ github.ref_name }}
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Upload API image scan to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.37.1
        with:
          sarif_file: trivy-api.sarif
          category: trivy-image-api

  build-web:
    name: Build web image
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve site url
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "site_url=https://book-nest.net" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://dev.book-nest.net" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/booknest-web:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.env.outputs.site_url }}
            API_BASE_URL=http://api-${{ github.ref_name }}:4000
          cache-from: type=gha,scope=web-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=web-${{ github.ref_name }}

      - name: Scan web image (Trivy)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/booknest-web:${{ github.ref_name }}
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Upload web image scan to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.37.1
        with:
          sarif_file: trivy-web.sarif
          category: trivy-image-web

  deploy:
    name: Deploy over SSH
    needs: [ci, build-api, build-web]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.ref_name }}"
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ]; then
            echo "health_url=https://book-nest.net/api/health" >> "$GITHUB_OUTPUT"
          else
            echo "health_url=https://dev.book-nest.net/api/health" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync stack files + secrets, then deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ENV: ${{ steps.env.outputs.name }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          DEV_JWT_ACCESS_SECRET: ${{ secrets.DEV_JWT_ACCESS_SECRET }}
          DEV_JWT_REFRESH_SECRET: ${{ secrets.DEV_JWT_REFRESH_SECRET }}
          PROD_JWT_ACCESS_SECRET: ${{ secrets.PROD_JWT_ACCESS_SECRET }}
          PROD_JWT_REFRESH_SECRET: ${{ secrets.PROD_JWT_REFRESH_SECRET }}
          PROD_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
          DEV_R2_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
          DEV_R2_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
          PROD_R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          PROD_R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHC="ssh -i ~/.ssh/id_ci"
          SCPC="scp -i ~/.ssh/id_ci"

          {
            echo "PROD_POSTGRES_USER=booknest"
            echo "PROD_POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD}"
            echo "PROD_POSTGRES_DB=booknest"
            echo "PROD_TAG=prod"
            echo "PROD_LOG_LEVEL=info"
            echo "PROD_ENABLE_SWAGGER=false"
            echo "DEV_POSTGRES_USER=booknest"
            echo "DEV_POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}"
            echo "DEV_POSTGRES_DB=booknest"
            echo "DEV_TAG=dev"
            echo "DEV_LOG_LEVEL=debug"
            echo "DEV_ENABLE_SWAGGER=true"
            echo "DEV_JWT_ACCESS_SECRET=${DEV_JWT_ACCESS_SECRET}"
            echo "DEV_JWT_REFRESH_SECRET=${DEV_JWT_REFRESH_SECRET}"
            echo "PROD_JWT_ACCESS_SECRET=${PROD_JWT_ACCESS_SECRET}"
            echo "PROD_JWT_REFRESH_SECRET=${PROD_JWT_REFRESH_SECRET}"
            echo "PROD_SMTP_PASS=${PROD_SMTP_PASS}"
            echo "DEV_R2_ACCESS_KEY_ID=${DEV_R2_ACCESS_KEY_ID}"
            echo "DEV_R2_SECRET_ACCESS_KEY=${DEV_R2_SECRET_ACCESS_KEY}"
            echo "PROD_R2_ACCESS_KEY_ID=${PROD_R2_ACCESS_KEY_ID}"
            echo "PROD_R2_SECRET_ACCESS_KEY=${PROD_R2_SECRET_ACCESS_KEY}"
            echo "API_IMAGE=ghcr.io/srh-yakovenko-ua/booknest-api"
            echo "WEB_IMAGE=ghcr.io/srh-yakovenko-ua/booknest-web"
          } > /tmp/server.env

          $SSHC "$USER@$HOST" "mkdir -p ~/booknest"
          $SCPC deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/README.md "$USER@$HOST:~/booknest/"
          $SCPC /tmp/server.env "$USER@$HOST:~/booknest/.env"
          $SSHC "$USER@$HOST" "chmod +x ~/booknest/deploy.sh && chmod 600 ~/booknest/.env"
          rm -f /tmp/server.env

          $SSHC "$USER@$HOST" ENV="$ENV" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" 'bash -s' <<'REMOTE'
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd ~/booknest
          ./deploy.sh "$ENV"
          docker logout ghcr.io
          REMOTE

      - name: Verify live health
        run: |
          URL="${{ steps.env.outputs.health_url }}"
          for i in $(seq 1 20); do
            if curl -fsS -m 10 "$URL" | grep -q '"status":"ok"'; then
              echo "live health ok: $URL"
              exit 0
            fi
            sleep 3
          done
          echo "live health check failed for $URL" >&2
          exit 1
