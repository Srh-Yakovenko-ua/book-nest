name: Deploy

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/srh-yakovenko-ua

jobs:
  deploy:
    name: Build images and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.ref_name }}"
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ]; then
            echo "site_url=https://book-nest.net" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://dev.book-nest.net" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/booknest-api:${{ steps.env.outputs.name }}
          cache-from: type=gha,scope=api-${{ steps.env.outputs.name }}
          cache-to: type=gha,mode=max,scope=api-${{ steps.env.outputs.name }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/booknest-web:${{ steps.env.outputs.name }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.env.outputs.site_url }}
            API_BASE_URL=http://api-${{ steps.env.outputs.name }}:4000
          cache-from: type=gha,scope=web-${{ steps.env.outputs.name }}
          cache-to: type=gha,mode=max,scope=web-${{ steps.env.outputs.name }}

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ENV: ${{ steps.env.outputs.name }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ci "$USER@$HOST" ENV="$ENV" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" 'bash -s' <<'REMOTE'
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd ~/booknest
          ./deploy.sh "$ENV"
          docker logout ghcr.io
          REMOTE
