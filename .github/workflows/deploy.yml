name: Deploy

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/srh-yakovenko-ua

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'

  deploy:
    name: Build images and deploy
    needs: [changes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.ref_name }}"
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ]; then
            echo "site_url=https://book-nest.net" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://dev.book-nest.net" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/booknest-api:${{ steps.env.outputs.name }}
          cache-from: type=gha,scope=api-${{ steps.env.outputs.name }}
          cache-to: type=gha,mode=max,scope=api-${{ steps.env.outputs.name }}

      - name: Build and push web image
        if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/booknest-web:${{ steps.env.outputs.name }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.env.outputs.site_url }}
            API_BASE_URL=http://api-${{ steps.env.outputs.name }}:4000
          cache-from: type=gha,scope=web-${{ steps.env.outputs.name }}
          cache-to: type=gha,mode=max,scope=web-${{ steps.env.outputs.name }}

      - name: Sync stack files + secrets, then deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ENV: ${{ steps.env.outputs.name }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          DEV_JWT_ACCESS_SECRET: ${{ secrets.DEV_JWT_ACCESS_SECRET }}
          DEV_JWT_REFRESH_SECRET: ${{ secrets.DEV_JWT_REFRESH_SECRET }}
          PROD_JWT_ACCESS_SECRET: ${{ secrets.PROD_JWT_ACCESS_SECRET }}
          PROD_JWT_REFRESH_SECRET: ${{ secrets.PROD_JWT_REFRESH_SECRET }}
          PROD_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHC="ssh -i ~/.ssh/id_ci"
          SCPC="scp -i ~/.ssh/id_ci"

          {
            echo "PROD_POSTGRES_USER=booknest"
            echo "PROD_POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD}"
            echo "PROD_POSTGRES_DB=booknest"
            echo "PROD_TAG=prod"
            echo "PROD_LOG_LEVEL=info"
            echo "PROD_ENABLE_SWAGGER=false"
            echo "DEV_POSTGRES_USER=booknest"
            echo "DEV_POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}"
            echo "DEV_POSTGRES_DB=booknest"
            echo "DEV_TAG=dev"
            echo "DEV_LOG_LEVEL=debug"
            echo "DEV_ENABLE_SWAGGER=true"
            echo "DEV_JWT_ACCESS_SECRET=${DEV_JWT_ACCESS_SECRET}"
            echo "DEV_JWT_REFRESH_SECRET=${DEV_JWT_REFRESH_SECRET}"
            echo "PROD_JWT_ACCESS_SECRET=${PROD_JWT_ACCESS_SECRET}"
            echo "PROD_JWT_REFRESH_SECRET=${PROD_JWT_REFRESH_SECRET}"
            echo "PROD_SMTP_PASS=${PROD_SMTP_PASS}"
            echo "API_IMAGE=ghcr.io/srh-yakovenko-ua/booknest-api"
            echo "WEB_IMAGE=ghcr.io/srh-yakovenko-ua/booknest-web"
          } > /tmp/server.env

          $SSHC "$USER@$HOST" "mkdir -p ~/booknest"
          $SCPC deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/README.md "$USER@$HOST:~/booknest/"
          $SCPC /tmp/server.env "$USER@$HOST:~/booknest/.env"
          $SSHC "$USER@$HOST" "chmod +x ~/booknest/deploy.sh && chmod 600 ~/booknest/.env"
          rm -f /tmp/server.env

          $SSHC "$USER@$HOST" ENV="$ENV" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" 'bash -s' <<'REMOTE'
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd ~/booknest
          ./deploy.sh "$ENV"
          docker logout ghcr.io
          REMOTE
